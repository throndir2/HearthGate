# Example stack: HearthGate server + Linux host agent + read-only docker socket proxy.
# 1. Copy config/hearthgate.example.yaml to ./data/hearthgate.yaml and edit it.
# 2. Copy config/agent.example.yaml to ./agent/agent.yaml and edit it (set docker.endpoint: http://docker-proxy:2375).
# 3. Create .env next to this file (never commit it):
#      HG_AGENT_NAS_TOKEN=<long random string>     # same value is given to the agent below
#      HG_GITHUB_TOKEN=                              # optional
#      HG_OIDC_CLIENT_SECRET=                        # optional
# 4. sudo chown -R 1654:1654 ./data   (the containers run as the non-root "app" user)
# 5. docker compose up -d, then put a reverse proxy (with TLS) in front of port 8080.

services:
  hearthgate:
    image: ghcr.io/throndir2/hearthgate:latest
    container_name: hearthgate
    restart: unless-stopped
    ports:
      - "127.0.0.1:3110:8080"     # publish only to the proxy; change the host IP to your LAN IP if the proxy is elsewhere
    environment:
      HG_ADMIN_USER: admin        # the first admin; a one-time set-password link is written to /data/first-admin-link.txt
      HG_AGENT_NAS_TOKEN: ${HG_AGENT_NAS_TOKEN}
      HG_GITHUB_TOKEN: ${HG_GITHUB_TOKEN:-}
      HG_OIDC_CLIENT_SECRET: ${HG_OIDC_CLIENT_SECRET:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [hearthgate]

  hearthgate-agent:
    image: ghcr.io/throndir2/hearthgate-agent:latest
    container_name: hearthgate-agent
    restart: unless-stopped
    environment:
      HG_AGENT_TOKEN: ${HG_AGENT_NAS_TOKEN}
    volumes:
      - ./agent:/config:ro
      # To report a disk, mount it read-only and list the mount path in agent.yaml under disks:
      # - /volume1:/host/volume1:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [hearthgate, docker-proxy]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: hearthgate-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1     # list containers (read-only)
      POST: 0           # set to 1 only if the agent must start/stop docker game servers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]

networks:
  hearthgate: {}
  docker-proxy:
    internal: true
